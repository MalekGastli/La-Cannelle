# La Cannelle on your own server. Run from the "deploy" folder:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lacannelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: lacannelle
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacannelle -d lacannelle"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lacannelle:${POSTGRES_PASSWORD}@db:5432/lacannelle
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_FORCE_PASSWORD: ${ADMIN_FORCE_PASSWORD:-disabled}
      FRONTEND_URL: https://${DOMAIN:?set DOMAIN in .env}
      CONTACT_RECEIVER: ${CONTACT_RECEIVER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      ORDER_SERVICE_FEE: ${ORDER_SERVICE_FEE:-48.90}
      # one reverse proxy hop (the website container) sits in front of the API
      TRUST_PROXY: "1"
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_LEGAL_COMPANY_NAME: ${NEXT_PUBLIC_LEGAL_COMPANY_NAME:-}
        NEXT_PUBLIC_LEGAL_FORM: ${NEXT_PUBLIC_LEGAL_FORM:-}
        NEXT_PUBLIC_LEGAL_OWNER: ${NEXT_PUBLIC_LEGAL_OWNER:-}
        NEXT_PUBLIC_LEGAL_EMAIL: ${NEXT_PUBLIC_LEGAL_EMAIL:-}
        NEXT_PUBLIC_LEGAL_PHONE: ${NEXT_PUBLIC_LEGAL_PHONE:-}
        NEXT_PUBLIC_LEGAL_REGISTER_COURT: ${NEXT_PUBLIC_LEGAL_REGISTER_COURT:-}
        NEXT_PUBLIC_LEGAL_REGISTER_NUMBER: ${NEXT_PUBLIC_LEGAL_REGISTER_NUMBER:-}
        NEXT_PUBLIC_LEGAL_VAT_ID: ${NEXT_PUBLIC_LEGAL_VAT_ID:-}
        NEXT_PUBLIC_LEGAL_EMAIL_PROVIDER: ${NEXT_PUBLIC_LEGAL_EMAIL_PROVIDER:-}
        NEXT_PUBLIC_LEGAL_ARBITRATION: ${NEXT_PUBLIC_LEGAL_ARBITRATION:-}
        NEXT_PUBLIC_LEGAL_HOSTING_NAME: ${NEXT_PUBLIC_LEGAL_HOSTING_NAME:-STRATO AG}
        NEXT_PUBLIC_LEGAL_HOSTING_ADDRESS: ${NEXT_PUBLIC_LEGAL_HOSTING_ADDRESS:-Otto-Ostrowski-Straße 7, 10249 Berlin}
        NEXT_PUBLIC_LEGAL_HOSTING_LOCATION: ${NEXT_PUBLIC_LEGAL_HOSTING_LOCATION:-Rechenzentrum in Deutschland}
        NEXT_PUBLIC_INSTAGRAM_HANDLE: ${NEXT_PUBLIC_INSTAGRAM_HANDLE:-}
        NEXT_PUBLIC_INSTAGRAM_PROFILE_URL: ${NEXT_PUBLIC_INSTAGRAM_PROFILE_URL:-}
        NEXT_PUBLIC_INSTAGRAM_POST_URLS: ${NEXT_PUBLIC_INSTAGRAM_POST_URLS:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://backend:3001/api
      JWT_SECRET: ${JWT_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
